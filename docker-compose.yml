# Local infrastructure for development and tests.
# Start it with `docker compose up -d`, stop it with `docker compose down`.
# `docker compose down -v` also deletes the data.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Development credentials only, never use these outside your machine
      POSTGRES_USER: beesaber
      POSTGRES_PASSWORD: beesaber
      POSTGRES_DB: beesaber
    ports:
      # Bound to localhost, so the database is not reachable from the network
      - '127.0.0.1:5432:5432'
    volumes:
      # Named volume, so the data survives restarts of the container
      - postgres-data:/var/lib/postgresql
      # Scripts in this folder run once, when the volume is created
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beesaber -d beesaber']
      interval: 5s
      timeout: 3s
      retries: 10

  # The app as the image from the Dockerfile, the way it runs in production.
  # Not started by `pnpm db`, only with `pnpm app`.
  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # The same settings as the development server, AUTH_SECRET and the
    # Google sign-in among them. The lines below replace what has to differ.
    env_file: server/.env
    environment:
      # Inside Docker, the database is reached by the name of its service
      DATABASE_URL: postgres://beesaber:beesaber@postgres:5432/beesaber
      # The address the browser opens; port 8080 on this machine
      APP_URL: http://localhost:8080
      # The image is a production build, which has no dev login
      DEV_LOGIN: 'false'
      # Where the Dockerfile put the frontend; server/.env leaves this empty
      FRONTEND_DIR: /app/public
    ports:
      - '127.0.0.1:8080:5001'

volumes:
  postgres-data:
