name: Claude review

# Claude reads every pull request, again after each push, and comments on
# what it finds. It only comments: it cannot push, approve or merge, and
# whether a pull request goes in stays a decision of the people on it.
#
# It signs in with the Claude subscription of the repository's owner, kept
# in the secret CLAUDE_CODE_OAUTH_TOKEN, and comments through the Claude
# GitHub app, which has access to this repository only.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    name: Review
    # Drafts are not ready to be read. Dependabot's pull requests get no
    # secrets, so a review of them could not sign in.
    if: >-
      !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push makes a review of the older one pointless
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      # Lets the action trade the job's token for one of the Claude app
      id-token: write

    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. README.md describes the project and
            its conventions; read the parts the change touches.

            Look for, in this order:
            1. Bugs: wrong behaviour, missed edge cases, races, errors that
               are swallowed.
            2. Security: secrets in code, logs or the image; checks that can
               be bypassed; more rights than needed in Azure, GitHub Actions
               or the database.
            3. Tests: behaviour that changed without a test that would catch
               it breaking.
            4. Comments that describe the history of the code ("now",
               "changed to", "used to") instead of why it is the way it is.

            Comment inline on the line a finding is about, with what goes
            wrong and when. Report only findings you are confident of. Leave
            out style that the formatter and linter already enforce, and do
            not praise. If you find nothing, say so in one sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
