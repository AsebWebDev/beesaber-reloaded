name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless, so cancel it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A Postgres that lives as long as this job. The server tests run against
    # it, the same way they run against the container from docker-compose.yml
    # on a developer's machine.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beesaber
          POSTGRES_PASSWORD: beesaber
          POSTGRES_DB: beesaber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beesaber -d beesaber_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # Reads the Node version from .nvmrc and caches the pnpm store
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails when pnpm-lock.yaml does not match the package.json files
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
