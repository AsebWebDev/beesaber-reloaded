name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the older run pointless, so cancel it.
# On main the runs go on: one of them may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The actions are pinned to an exact commit, with the version it belongs to
# as a comment. A tag like "v7" can be moved to different code by whoever
# controls the action; a commit cannot. Dependabot keeps both up to date.

jobs:
  check:
    # The branch protection of main requires the check with this name
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A Postgres that lives as long as this job. The server tests run against
    # it, the same way they run against the container from docker-compose.yml
    # on a developer's machine.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beesaber
          POSTGRES_PASSWORD: beesaber
          POSTGRES_DB: beesaber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beesaber -d beesaber_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from "packageManager" in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Reads the Node version from .nvmrc and caches the pnpm store
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails when pnpm-lock.yaml does not match the package.json files
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      # Two kinds of files are made by a tool from something else: the
      # database migrations from the schema, and the ScoreSaber types from its
      # API description. Making them again must change nothing. If it does,
      # someone changed the source and forgot to run the tool.
      - name: Check that generated files are up to date
        run: pnpm --filter @beesaber/server check:generated

      # Fails when a test fails, and when the tests reach less of the code
      # than the thresholds in the vitest configuration ask for
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Builds the image the way a deployment would and starts it against a
  # database, without uploading it anywhere. A broken Dockerfile shows here,
  # not on the day of a release.
  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: beesaber
          POSTGRES_PASSWORD: beesaber
          POSTGRES_DB: beesaber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beesaber -d beesaber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --tag beesaber:ci .

      # Trivy runs from its own image, pinned like the actions above, instead
      # of through a third-party action with access to the repository.

      # Known vulnerabilities in the image: in Alpine's packages, in Node and
      # in the npm packages. Serious ones that already have a fix fail the
      # check. For the others there is nothing to do until a fix exists.
      # Also secrets, like a key or a password in a file: the image is
      # public, so none may ever end up in it.
      - name: Scan the image for known vulnerabilities and secrets
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln,secret --exit-code 1 --severity HIGH,CRITICAL
          --ignore-unfixed beesaber:ci

      # Insecure settings in the Dockerfile and the Terraform files, like a
      # container running as root or storage open to everyone. Everything
      # found is listed; serious findings fail the check.
      - name: Scan the configuration for insecure settings
        run: >-
          docker run --rm --volume "$PWD:/src:ro"
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          config --exit-code 1 --severity HIGH,CRITICAL /src

      # The container shares the network of the runner, so it reaches the
      # database at localhost
      - name: Start the image
        run: >-
          docker run --detach --name app --network host
          --env DATABASE_URL=postgres://beesaber:beesaber@localhost:5432/beesaber
          --env APP_URL=http://localhost:5001
          --env AUTH_SECRET=a-secret-only-used-by-this-check-0123456789
          --env LIVE_FEED=false
          beesaber:ci

      - name: Wait until it answers
        run: |
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:5001/api/health; then
              curl --silent --fail --output /dev/null http://localhost:5001/
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      # On main, the image checked above is the one that gets published and
      # deployed, rather than a second build of the same code that could
      # differ from it
      - name: Keep the image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save beesaber:ci | gzip > image.tar.gz

      - name: Hand the image to the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # A job of its own, and not required for merging: a vulnerability that is
  # published today in a dependency has nothing to do with the change under
  # review, and should not hide whether that change works. It still shows up
  # red on every run until it is dealt with.
  audit:
    name: Dependencies without known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Only dependencies that ship to users, and only serious problems
      - name: Check dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level high

  # Only on main, once the checks above have passed: the checked image goes
  # to the GitHub Container Registry. Its own job, because it is the only one
  # that may write packages.
  publish:
    name: Publish the image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Take over the checked image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      # Tagged with the commit, so the registry shows which code it is. What
      # gets deployed is the digest, a fingerprint of the content: a tag can
      # be moved to another image, a digest cannot.
      - name: Push it
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip --stdout image.tar.gz | docker load
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beesaber"
          docker tag beesaber:ci "$name:${GITHUB_SHA::7}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$name:${GITHUB_SHA::7}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$name:${GITHUB_SHA::7}")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest"

  # Switches the app in Azure to the published image. The steps live in
  # deploy.yml, which rolling back uses as well.
  deploy:
    name: Deploy
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.publish.outputs.image }}
    # The production environment's Azure ids
    secrets: inherit
    permissions:
      id-token: write
